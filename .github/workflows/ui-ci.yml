name: UI CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint:styles

      - name: Prettier
        run: pnpm format:check

      - name: TypeScript
        run: pnpm check-types

      - name: Build
        run: pnpm build

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build UI image
        run: docker build -t dmc-268-ui-t2:${{ github.sha }} .

  publish:
    name: Publish UI image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - quality
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Build immutable UI image
        run: docker build -t "${IMAGE_NAME}:sha-${GITHUB_SHA}" .

      - name: Push immutable UI image
        run: docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"
